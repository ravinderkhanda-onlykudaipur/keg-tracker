<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>Keg Tracker</title>

<!-- PWA installability - manifest.json's start_url points here, so
     this is the app's actual home screen destination. -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kegs">
<style>
  /* Full palette from the original app's design, not the smaller
     ad-hoc set this page's first version used. */
  :root {
    --bg: #FFFFFF;
    --card-bg: #F5F5F5;
    --card-border: #E8E6E0;
    --text: #1A1A1A;
    --text-secondary: #6B6B6B;
    --text-muted: #A0A0A0;
    --input-bg: #FFFFFF;
    --input-border: #D6D3CC;
    --primary: #2FA8F5;
    --primary-hover: #1E8FDB;
    --primary-tint-bg: #E6F1FB;
    --primary-tint-text-dark: #0C447C;
    --primary-tint-text-mid: #185FA5;
    --success-bg: #E8F5E9;
    --success-text: #1B5E20;
    --error-bg: #FDEBEA;
    --error-text: #B3261E;
    --error-border: #F3C6C2;
    --warn-bg: #FFF4E0;
    --warn-text: #8A5700;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 400; max-width: 480px; margin: 0 auto; padding: 18px 16px; color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.5; }
  h2 { font-size: 20px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
  h3 { font-size: 16px; font-weight: 500; color: var(--text); margin: 0 0 4px; }
  .muted { color: var(--text-secondary); font-size: 13px; }
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin: 14px 0; }
  label { display: block; font-size: 13px; margin: 10px 0 5px; font-weight: 500; color: var(--text); }
  input, select { width: 100%; box-sizing: border-box; font-family: inherit; font-size: 16px; font-weight: 400; padding: 12px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--text); }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47,168,245,0.18); }
  button { width: 100%; margin-top: 16px; font-family: inherit; font-size: 16px; font-weight: 500; padding: 13px; background: var(--primary); color: #FFFFFF; border: none; border-radius: 10px; cursor: pointer; }
  button.secondary { background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border); width: auto; margin: 8px 4px 0 0; padding: 10px 16px; }
  button:disabled { opacity: 0.6; }
  .error { color: var(--error-text); font-size: 13px; margin-top: 8px; }
  .success { color: var(--success-text); font-size: 13px; margin-top: 8px; }

  /* Top banner - the app's original illustrated scene, purely visual
     brand identity, unrelated to whichever custody model runs
     underneath it. */
  .top-banner { margin: -18px -16px 0 -16px; height: 140px; position: relative; overflow: hidden; }
  .top-banner svg { display: block; width: 100%; height: 140px; }
  .top-banner .banner-logo { position: absolute; left: 50%; top: 34px; transform: translate(-50%, -50%); width: 46px; height: 46px; border-radius: 50%; }

  .app-header { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; }
  .user-chip { font-size: 13px; color: var(--text-secondary); }

  /* Current custody state - a plain fact, never a prediction (this is
     the actual point of the whole v2 rebuild - see
     lib/v2/DATA_MODEL.md's "Why this replaces Now/Next entirely").
     Visually modeled on the original Now/Next icon-and-label layout,
     just showing one fact instead of a now/next pair. */
  .custody-card { text-align: center; }
  .custody-icon-wrap { margin: 6px auto 4px; }
  .custody-location { font-size: 20px; font-weight: 600; }
  .custody-sublocation { font-size: 14px; color: var(--text-secondary); }
  .custody-condition { display: inline-block; margin-top: 8px; padding: 4px 12px; border-radius: 10px; background: var(--primary-tint-bg); color: var(--primary-tint-text-dark); font-size: 13px; font-weight: 500; }

  .pending-banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 10px 14px; font-size: 13px; font-weight: 500; text-align: center; margin: 10px 0; }

  .action-btn-wrap { margin-top: 10px; }

  /* Dashboard groups - same collapsible pattern also used on
     index.html, kept consistent across both. */
  .dash-group { margin: 12px 0; }
  .dash-group-summary { cursor: pointer; list-style: none; font-size: 15px; font-weight: 500; color: var(--text); padding: 12px 16px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; display: flex; align-items: center; gap: 10px; }
  .dash-group-summary::-webkit-details-marker { display: none; }
  .dash-group-summary::before { content: '\25B8'; color: var(--text-muted); transition: transform 0.15s; }
  .dash-group[open] > .dash-group-summary::before { transform: rotate(90deg); }
  .dash-group-content { padding: 8px 4px 4px; }
  .dash-count { background: var(--primary-tint-bg); color: var(--primary-tint-text-dark); font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 10px; }
  .dash-item { display: inline-block; padding: 5px 10px; margin: 3px; border-radius: 8px; background: var(--bg); border: 1px solid var(--card-border); font-size: 13px; font-weight: 500; color: var(--primary); text-decoration: none; }
  .dash-item:active { background: var(--primary-tint-bg); }
  .dash-item.pending { background: var(--warn-bg); border-color: var(--warn-text); color: var(--warn-text); }
  .dash-empty { font-size: 13px; color: var(--text-muted); padding: 4px; }

  /* Home tabs (Alerts/Task/Feedback) - same tab-bar pattern already
     used on index.html, replicated here since these are separate
     standalone files with their own stylesheets. */
  .tab-bar { display: flex; gap: 4px; margin: 12px 0; border-bottom: 1px solid var(--card-border); }
  .tab-btn { flex: 1; background: none; border: none; padding: 10px 4px; font-size: 14px; font-weight: 500; color: var(--text-secondary); cursor: pointer; border-bottom: 2px solid transparent; margin: 0; width: auto; }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

  .task-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; margin: 6px 0; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; }
  .task-item.completed .task-text { text-decoration: line-through; color: var(--text-muted); }
  .task-text { flex: 1; font-size: 14px; }
  .task-delete { width: auto; margin: 0; padding: 4px 10px; background: none; color: var(--error-text); font-size: 13px; }

  /* Alerts - kegs overdue per lib/v2/alerts.js, filtered to the
     logged-in user's own role (Admin/Manager see everything via
     index.html's own overview instead - this is the operational, in-
     app version). */
  .alert-item { background: var(--error-bg); border: 1px solid var(--error-border); border-radius: 10px; padding: 10px 14px; margin: 8px 0; font-size: 13px; }
  .alert-item a { color: var(--error-text); font-weight: 600; text-decoration: none; }
  .alert-label { color: var(--error-text); }
  .alert-overdue { color: var(--text-secondary); font-size: 12px; }
</style>
</head>

<!-- jsQR is a well-known, lightweight, pure-JS QR decoding library -
     there's no browser-native API for this, and hand-rolling QR
     decoding (image processing + Reed-Solomon error correction) isn't
     practical, so this is the one exception to the app's otherwise
     dependency-free footprint (the only other external script
     anywhere is device-id.js). URL verified directly against the
     library's own GitHub source (github.com/cozmo/jsQR/dist/jsQR.js)
     after an earlier guessed URL (a ".min.js" filename that doesn't
     actually exist in this package) silently failed to load - a
     script tag with a broken src fails silently in the browser, which
     is exactly why the defensive check in scanLoop() below exists now. -->
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<script src="/device-id.js"></script>
<script>
let currentUser = null;
let currentKeg = null;
let availableTransitions = [];
const kegId = new URLSearchParams(location.search).get('keg');

// Uses the app's uploaded SVG icon files (public/icons/) - has both
// 'mover' and 'warehouse' as distinct location values (unlike the
// prior version of this cycle, which only ever had a single
// 'warehouse' role), so both map to the same 'mover' icon file,
// matching entityRoleMapping.js's own reasoning: Mover is the person
// who physically operates on Warehouse's behalf, so the same icon
// representing that person fits both location values.
const LOCATION_ICON_FILE = { washer: 'washer', filler: 'filler', driver: 'driver', mover: 'mover', warehouse: 'mover' };

function locationIcon(location) {
  if (location === 'customer') {
    // Not a role with an uploaded icon file - a location pin drawn
    // inline instead, same shape used for the Destination card
    // elsewhere in the app, so "with the customer" reads as a place,
    // not a person.
    return `<svg width="56" height="56" viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg"><circle cx="28" cy="28" r="28" fill="#C7EDC7"/><g transform="translate(14,14)" stroke="#1B5E20" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></g></svg>`;
  }
  const file = LOCATION_ICON_FILE[location];
  if (!file) return '';
  return `<img src="/icons/${file}-green.svg" width="56" height="56" alt="">`;
}

async function init() {
  let me = null;
  try {
    const meRes = await fetch('/api/auth/me', { credentials: 'include', cache: 'no-store' });
    me = await meRes.json();
  } catch (err) {
    document.getElementById('loginBlock').innerHTML = '<p class="error">No connection - connect once to log in.</p>';
    return;
  }
  if (me) { currentUser = me; showApp(); return; }

  const res = await fetch('/api/auth/users', { cache: 'no-store' });
  const users = await res.json();
  document.getElementById('userSelect').innerHTML =
    users.map(u => `<option value="${u.id}">${u.name} (${u.role})</option>`).join('');
}

async function login() {
  const userId = document.getElementById('userSelect').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    credentials: 'include', cache: 'no-store',
    body: JSON.stringify({ userId, password, deviceId: DeviceId.get() }),
  });
  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    document.getElementById('loginError').textContent = data.error || 'Invalid password';
    return;
  }
  currentUser = await res.json();
  showApp();
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'include', cache: 'no-store' });
  location.reload();
}

function showApp() {
  document.getElementById('loginBlock').style.display = 'none';
  document.getElementById('appBlock').style.display = 'block';
  document.getElementById('whoami').textContent = `${currentUser.name} (${currentUser.role})`;

  // Admin lands here first now that this page is the PWA's start_url,
  // but has no oversight functionality here at all - a pure observer
  // has nothing to act on, and the dashboard groups shown to
  // operational roles don't mean much without any action to take from
  // them. Redirected to index.html instead - skipped when a specific
  // keg IS requested (a direct scan, or a Keg ID link clicked from
  // Admin's own Kegs table), since that's a legitimate reason to stay here.
  if (currentUser.role === 'admin' && !kegId) {
    location.href = '/index.html';
    return;
  }

  if (!kegId) {
    document.getElementById('noKegBlock').style.display = 'block';
    document.getElementById('homeTabs').style.display = 'block';
    loadAlerts();
    loadDashboard();
    return;
  }
  document.getElementById('kegBlock').style.display = 'block';
  loadKeg();
}

// In-app QR scanner - opens the rear camera directly, rather than
// relying on the phone's separate camera app to scan a printed code
// and then open a link. Uses jsQR (loaded via CDN above) to decode
// each captured video frame.
let scanStream = null;
let scanAnimationFrame = null;

async function startScan() {
  const modal = document.getElementById('scanModal');
  const video = document.getElementById('scanVideo');
  const statusEl = document.getElementById('scanStatus');
  statusEl.textContent = '';

  // Defensive check: a script tag with a broken/unreachable src fails
  // silently in the browser (no thrown error, jsQR just never becomes
  // defined) - without this check, that failure mode looks exactly
  // like "the camera opened but scanning does nothing", with no error
  // message anywhere to explain why. Caught exactly this once already
  // from a guessed CDN URL that didn't actually exist - see the
  // comment on the script tag itself.
  if (typeof jsQR !== 'function') {
    alert('The QR scanning library failed to load. Check your internet connection and try again.');
    return;
  }

  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch (err) {
    alert('Could not access the camera: ' + err.message);
    return;
  }

  video.srcObject = scanStream;
  modal.style.display = 'block';
  scanLoop();
}

function stopScan() {
  document.getElementById('scanModal').style.display = 'none';
  if (scanAnimationFrame) cancelAnimationFrame(scanAnimationFrame);
  if (scanStream) {
    scanStream.getTracks().forEach((track) => track.stop());
    scanStream = null;
  }
}

function scanLoop() {
  const video = document.getElementById('scanVideo');
  const canvas = document.getElementById('scanCanvas');

  // Wrapped in try/catch as defense-in-depth beyond the startup check
  // in startScan() - an uncaught exception anywhere in this function
  // would otherwise silently kill the requestAnimationFrame loop with
  // no visible error, looking exactly like "the camera opened but
  // scanning does nothing" with no clue why.
  try {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);

      if (code && code.data) {
        handleScannedUrl(code.data);
        return; // stop the loop - handleScannedUrl navigates away or shows an error
      }
    }
  } catch (err) {
    document.getElementById('scanStatus').textContent = 'Scanning error: ' + err.message;
  }
  scanAnimationFrame = requestAnimationFrame(scanLoop);
}

// Accepts either a full URL (from a real printed QR code, e.g.
// https://.../scan.html?keg=KEG-ABC123) or just a bare keg ID, and
// navigates to that keg's page - never trusts the scanned content
// beyond extracting a keg ID from it, never eval's or otherwise
// executes anything from the decoded text.
function handleScannedUrl(scanned) {
  const statusEl = document.getElementById('scanStatus');
  let extractedKegId = null;
  try {
    const url = new URL(scanned);
    extractedKegId = url.searchParams.get('keg');
  } catch (err) {
    // Not a full URL - treat the scanned text itself as the keg ID.
    extractedKegId = scanned.trim();
  }

  if (!extractedKegId) {
    statusEl.textContent = 'That QR code doesn\'t look like a keg code. Try again.';
    scanAnimationFrame = requestAnimationFrame(scanLoop);
    return;
  }

  stopScan();
  location.href = `/scan.html?keg=${encodeURIComponent(extractedKegId)}`;
}

function showHomeTab(tab) {
  ['alerts', 'task', 'feedback'].forEach((t) => {
    document.getElementById(`homeTab-${t}`).style.display = t === tab ? 'block' : 'none';
    document.getElementById(`homeTabBtn-${t}`).classList.toggle('active', t === tab);
  });
  if (tab === 'task') loadTasks();
}

// Personal to-do list - scoped server-side to the logged-in user's own
// tasks (see routes/tasks.js), not just hidden in this UI.
async function loadTasks() {
  const el = document.getElementById('taskList');
  const res = await fetch('/api/tasks', { credentials: 'include', cache: 'no-store' });
  if (!res.ok) { el.innerHTML = '<p class="muted">Could not load tasks.</p>'; return; }
  const tasks = await res.json();
  if (!tasks.length) { el.innerHTML = '<p class="muted">No tasks yet.</p>'; return; }
  el.innerHTML = tasks.map((t) => `
    <div class="task-item${t.completed ? ' completed' : ''}">
      <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id}, this.checked)">
      <span class="task-text">${t.text}</span>
      <button class="task-delete" onclick="deleteTask(${t.id})">Delete</button>
    </div>
  `).join('');
}

async function addTask() {
  const input = document.getElementById('newTaskText');
  const text = input.value.trim();
  if (!text) return;
  await fetch('/api/tasks', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    credentials: 'include', cache: 'no-store',
    body: JSON.stringify({ text }),
  });
  input.value = '';
  await loadTasks();
}

async function toggleTask(id, completed) {
  await fetch(`/api/tasks/${id}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' },
    credentials: 'include', cache: 'no-store',
    body: JSON.stringify({ completed }),
  });
  await loadTasks();
}

async function deleteTask(id) {
  await fetch(`/api/tasks/${id}`, { method: 'DELETE', credentials: 'include', cache: 'no-store' });
  await loadTasks();
}

// Anonymous feedback - see routes/feedback.js for why this genuinely
// never sends or stores any identifying information.
async function submitFeedback() {
  const textEl = document.getElementById('feedbackText');
  const text = textEl.value.trim();
  const msg = document.getElementById('feedbackMsg');
  if (!text) { msg.className = 'error'; msg.textContent = 'Enter some feedback first.'; return; }

  const res = await fetch('/api/feedback', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    credentials: 'include', cache: 'no-store',
    body: JSON.stringify({ text }),
  });
  if (!res.ok) { msg.className = 'error'; msg.textContent = 'Could not send feedback.'; return; }
  textEl.value = '';
  msg.className = 'success';
  msg.textContent = 'Sent anonymously. Thank you.';
}

const DASHBOARD_GROUPS = [
  { label: 'At Washer', match: (k) => k.current_location === 'washer' },
  { label: 'At Filler', match: (k) => k.current_location === 'filler' },
  { label: 'With Mover', match: (k) => k.current_location === 'mover' },
  { label: 'Warehouse: Uncleaned Storage', match: (k) => k.current_location === 'warehouse' && k.warehouse_sublocation === 'uncleaned' },
  { label: 'Warehouse: Cleaned Storage', match: (k) => k.current_location === 'warehouse' && k.warehouse_sublocation === 'cleaned' },
  { label: 'Warehouse: Filled Storage', match: (k) => k.current_location === 'warehouse' && k.warehouse_sublocation === 'filled' },
  { label: 'Warehouse: Damaged Storage', match: (k) => k.current_location === 'warehouse' && k.warehouse_sublocation === 'damaged' },
  { label: 'With Driver', match: (k) => k.current_location === 'driver' },
  { label: 'With Customer', match: (k) => k.current_location === 'customer' },
];

// Fetches overdue kegs and shows only the ones relevant to the
// logged-in user's own role - Manager sees everything (matches the
// same full-bypass permission Manager has everywhere else in v2),
// Admin never reaches this page at all (redirected above).
async function loadAlerts() {
  const el = document.getElementById('alertsBlock');
  const res = await fetch('/api/v2/kegs/alerts', { credentials: 'include', cache: 'no-store' });
  if (!res.ok) { el.innerHTML = ''; return; }
  const alerts = await res.json();
  const relevant = currentUser.role === 'manager' ? alerts : alerts.filter((a) => a.role === currentUser.role);

  if (!relevant.length) { el.innerHTML = ''; return; }
  el.innerHTML = relevant.map((a) => `
    <div class="alert-item">
      <a href="/scan.html?keg=${a.kegId}">${a.kegId}</a>${a.manufacturingNumber ? ` <span class="muted">(Serial: ${a.manufacturingNumber})</span>` : ''}
      \u2014 <span class="alert-label">${a.label}</span>
      <span class="alert-overdue">(${a.hoursOverdue}h overdue)</span>
      <div class="muted" style="font-size:11px">${a.transitionIds.join(' or ')}</div>
    </div>
  `).join('');
}

async function loadDashboard() {
  const el = document.getElementById('dashboardBlock');
  const res = await fetch('/api/v2/kegs', { credentials: 'include', cache: 'no-store' });
  if (!res.ok) { el.innerHTML = ''; return; }
  const kegs = await res.json();

  el.innerHTML = DASHBOARD_GROUPS.map((group) => {
    const matched = kegs.filter(group.match);
    const itemsHtml = matched.length
      ? matched.map((k) => `<a class="dash-item${k.pending_handover_to ? ' pending' : ''}" href="/scan.html?keg=${k.id}">${k.id} \u2013 ${CONDITION_LABELS[k.current_condition] || k.current_condition}${k.pending_handover_to ? ', pending' : ''}</a>`).join('')
      : '<div class="dash-empty">None right now.</div>';
    return `
      <details class="dash-group">
        <summary class="dash-group-summary">${group.label} <span class="dash-count">${matched.length}</span></summary>
        <div class="dash-group-content">${itemsHtml}</div>
      </details>
    `;
  }).join('');
}

async function loadKeg() {
  const res = await fetch(`/api/v2/kegs/${kegId}`, { credentials: 'include', cache: 'no-store' });
  if (!res.ok) {
    document.getElementById('kegBlock').innerHTML = '<p class="error">Could not load this keg.</p>';
    return;
  }
  const data = await res.json();
  currentKeg = data.keg;
  availableTransitions = data.availableTransitions;
  renderKeg();
}

const LOCATION_LABELS = { customer: 'Customer', driver: 'Driver', mover: 'Mover', washer: 'Washer', filler: 'Filler', warehouse: 'Warehouse' };
const SUBLOCATION_LABELS = { uncleaned: 'Uncleaned Storage', cleaned: 'Cleaned Storage', filled: 'Filled Storage', damaged: 'Damaged Storage' };
const CONDITION_LABELS = { empty: 'Empty', washing: 'Washing', cleaned: 'Cleaned', filling: 'Filling', filled: 'Filled', to_be_delivered: 'To Be Delivered', delivered: 'Delivered', delivery_failed: 'Delivery Failed', damaged: 'Damaged' };
const REASON_LABELS = { forgot_to_deliver: 'Forgot to Deliver', damaged: 'Damaged Item/Keg', customer_refused: 'Customer Refused to Accept', customer_unavailable: 'Customer Unavailable', shop_closed: 'Shop Closed', other: 'Other' };

function renderKeg() {
  document.getElementById('kegIdHeading').textContent = currentKeg.id;

  // Current custody - a plain fact, never a prediction. See
  // lib/v2/DATA_MODEL.md's "Why this replaces Now/Next entirely".
  document.getElementById('custodyIconWrap').innerHTML = locationIcon(currentKeg.current_location);
  document.getElementById('custodyLocation').textContent = LOCATION_LABELS[currentKeg.current_location] || currentKeg.current_location;
  document.getElementById('custodySublocation').textContent = currentKeg.warehouse_sublocation
    ? SUBLOCATION_LABELS[currentKeg.warehouse_sublocation] || currentKeg.warehouse_sublocation : '';
  document.getElementById('custodyCondition').textContent = CONDITION_LABELS[currentKeg.current_condition] || currentKeg.current_condition;
  document.getElementById('custodyCustomer').textContent = currentKeg.current_customer_name
    ? `Destination: ${currentKeg.current_customer_name}` : '';
  document.getElementById('custodyFillDetails').textContent = currentKeg.current_product_name
    ? `${currentKeg.current_product_name} \u00b7 Batch ${currentKeg.current_batch_number} \u00b7 ${currentKeg.current_abv}% ABV` : '';

  const pendingWrap = document.getElementById('pendingBannerWrap');
  if (currentKeg.pending_handover_to) {
    pendingWrap.innerHTML = `<div class="pending-banner">Awaiting receipt by ${LOCATION_LABELS[currentKeg.pending_handover_to] || currentKeg.pending_handover_to}</div>`;
  } else {
    pendingWrap.innerHTML = '';
  }
  renderConfirmSection();
  renderRevertSection();
  renderAvailableActions();
}

const ENTITY_TO_DB_ROLE = { customer: 'driver', driver: 'driver', mover: 'warehouse', washer: 'washer', filler: 'filler', warehouse: 'warehouse' };
function dbRoleCanActAsEntity(dbRole, entity) {
  if (dbRole === 'manager') return true;
  return ENTITY_TO_DB_ROLE[entity] === dbRole;
}

function renderConfirmSection() {
  const el = document.getElementById('confirmSection');
  if (!currentKeg.pending_handover_to || !dbRoleCanActAsEntity(currentUser.role, currentKeg.pending_handover_to)) {
    el.innerHTML = '';
    return;
  }
  el.innerHTML = `<button onclick="submitConfirm()">Confirm receipt</button><div id="confirmMsg"></div>`;
}

// Mover (warehouse role), Admin, and Manager can undo the single most
// recent event on a keg - matches v1's own revert scope. Shown
// regardless of pending-handover state, since an in-progress two-scan
// handover's own 'initiated' event is itself undoable (cancels the
// pending handover cleanly).
function renderRevertSection() {
  const el = document.getElementById('revertSection');
  const canRevert = ['admin', 'warehouse', 'manager'].includes(currentUser.role);
  if (!canRevert) { el.innerHTML = ''; return; }
  el.innerHTML = `<button class="secondary" onclick="submitRevert()">Undo last action</button><div id="revertMsg"></div>`;
}

async function submitRevert() {
  const msg = document.getElementById('revertMsg');
  const res = await fetch(`/api/v2/kegs/${kegId}/revert`, {
    method: 'POST', credentials: 'include', cache: 'no-store',
  });
  const data = await res.json();
  if (!res.ok) {
    msg.className = 'error';
    msg.textContent = data.error;
    return;
  }
  msg.className = 'success';
  msg.textContent = 'Reverted.';
  setTimeout(loadKeg, 800);
}

function renderAvailableActions() {
  const el = document.getElementById('actionsSection');
  document.getElementById('actionFormSection').innerHTML = '';
  if (currentKeg.pending_handover_to) {
    el.innerHTML = '';
    return;
  }
  if (!availableTransitions.length) {
    el.innerHTML = '<p class="muted">No actions available for your role on this keg right now.</p>';
    return;
  }
  el.innerHTML = availableTransitions.map((t) => `
    <div class="action-btn-wrap">
      <button class="${availableTransitions.length > 1 ? 'secondary' : ''}" onclick="selectAction('${t.id}')">${t.label}</button>
    </div>
  `).join('');
}

function selectAction(transitionId) {
  const t = availableTransitions.find((x) => x.id === transitionId);
  const formEl = document.getElementById('actionFormSection');

  let fieldsHtml = '';
  if (t.requiresReason) {
    fieldsHtml += `
      <label>Reason</label>
      <select id="f_reason" onchange="toggleReasonOther()">
        ${t.reasonOptions.map((r) => `<option value="${r}">${REASON_LABELS[r] || r}</option>`).join('')}
      </select>
      <div id="reasonOtherWrap" style="display:none">
        <label>Please describe</label>
        <input type="text" id="f_reasonText">
      </div>
    `;
  }
  if (t.requiresCustomer) {
    fieldsHtml += `<label>Delivery destination (customer)</label><select id="f_customerId"></select>`;
  }
  if (t.requiresProductDetails) {
    fieldsHtml += `
      <label>Beer Name</label>
      <select id="f_productId" onchange="onProductSelected()"></select>
      <div id="newProductWrap" style="display:none">
        <label>New beer name</label>
        <input type="text" id="f_newProductName">
        <label>Default ABV % (optional)</label>
        <input type="number" step="0.1" id="f_newProductAbv">
        <button type="button" class="secondary" onclick="saveNewProduct()">Save new beer</button>
      </div>
      <label>Batch Number</label>
      <input type="text" id="f_batchNumber">
      <label>ABV %</label>
      <input type="number" step="0.1" id="f_abv">
    `;
  }

  formEl.innerHTML = `
    <div class="card">
      <h3 style="margin-top:0">${t.label}</h3>
      ${fieldsHtml}
      <button onclick="submitAction('${t.id}', ${t.twoScan})">Confirm</button>
      <div id="actionMsg"></div>
    </div>
  `;

  if (t.requiresCustomer) populateCustomerSelect();
  if (t.requiresProductDetails) populateProductSelect();
}

let productsCache = [];

async function populateProductSelect() {
  const res = await fetch('/api/products', { credentials: 'include', cache: 'no-store' });
  productsCache = res.ok ? await res.json() : [];
  document.getElementById('f_productId').innerHTML =
    productsCache.map((p) => `<option value="${p.id}">${p.name}</option>`).join('') +
    '<option value="__new__">-- Add new beer --</option>';
  onProductSelected();
}

function onProductSelected() {
  const sel = document.getElementById('f_productId');
  const isNew = sel.value === '__new__';
  document.getElementById('newProductWrap').style.display = isNew ? 'block' : 'none';
  if (!isNew) {
    const product = productsCache.find((p) => p.id === sel.value);
    if (product && product.default_abv != null) {
      document.getElementById('f_abv').value = product.default_abv;
    }
  }
}

// Mirrors v1's inline "add new product" pattern - Filler shouldn't be
// blocked mid-workflow the first time they need a beer that doesn't
// exist yet in the managed list (see routes/products.js's own comment
// on why this list exists at all: consistent naming for reporting).
async function saveNewProduct() {
  const name = document.getElementById('f_newProductName').value.trim();
  if (!name) { alert('Enter a beer name first.'); return; }
  const defaultAbv = document.getElementById('f_newProductAbv').value;
  const res = await fetch('/api/products', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    credentials: 'include', cache: 'no-store',
    body: JSON.stringify({ name, default_abv: defaultAbv || null }),
  });
  const data = await res.json();
  if (!res.ok) { alert(data.error); return; }
  await populateProductSelect();
  document.getElementById('f_productId').value = data.id;
  onProductSelected();
}

function toggleReasonOther() {
  const reason = document.getElementById('f_reason').value;
  document.getElementById('reasonOtherWrap').style.display = reason === 'other' ? 'block' : 'none';
}

async function populateCustomerSelect() {
  const res = await fetch('/api/customers', { credentials: 'include', cache: 'no-store' });
  const customers = res.ok ? await res.json() : [];
  document.getElementById('f_customerId').innerHTML =
    '<option value="">-- select customer --</option>' +
    customers.map((c) => `<option value="${c.id}">${c.name}</option>`).join('');
}

function collectDetails(t) {
  const details = {};
  if (t.requiresReason) {
    details.reason = document.getElementById('f_reason').value;
    if (details.reason === 'other') details.reasonText = document.getElementById('f_reasonText').value;
  }
  if (t.requiresCustomer) {
    details.customerId = document.getElementById('f_customerId').value;
  }
  if (t.requiresProductDetails) {
    details.productId = document.getElementById('f_productId').value;
    details.batchNumber = document.getElementById('f_batchNumber').value;
    details.abv = document.getElementById('f_abv').value;
  }
  return details;
}

async function submitAction(transitionId, twoScan) {
  const t = availableTransitions.find((x) => x.id === transitionId);
  const details = collectDetails(t);
  const msg = document.getElementById('actionMsg');

  // Guards against submitting with "Add new beer" still selected but
  // never actually saved - would otherwise send the literal placeholder
  // value as the product ID.
  if (t.requiresProductDetails && details.productId === '__new__') {
    msg.className = 'error';
    msg.textContent = 'Save the new beer first, or pick an existing one.';
    return;
  }

  const endpoint = twoScan ? 'initiate' : 'execute';
  const res = await fetch(`/api/v2/kegs/${kegId}/${endpoint}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    credentials: 'include', cache: 'no-store',
    body: JSON.stringify({ transitionId, details }),
  });
  const data = await res.json();
  if (!res.ok) {
    msg.className = 'error';
    msg.textContent = data.error;
    return;
  }
  msg.className = 'success';
  msg.textContent = 'Done.';
  setTimeout(loadKeg, 800);
}

async function submitConfirm() {
  const msg = document.getElementById('confirmMsg');
  const res = await fetch(`/api/v2/kegs/${kegId}/confirm`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    credentials: 'include', cache: 'no-store',
  });
  const data = await res.json();
  if (!res.ok) {
    msg.className = 'error';
    msg.textContent = data.error;
    return;
  }
  msg.className = 'success';
  msg.textContent = 'Receipt confirmed.';
  setTimeout(loadKeg, 800);
}

init();
</script>
