<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
<title>Keg Scan</title>

<!-- PWA installability: lets "Add to Home Screen" create a real app icon
     that opens full-screen (no browser address bar) instead of just a
     bookmark. manifest.json covers Android/Chrome; the apple-* tags
     below cover iOS Safari, which doesn't fully honor the manifest. -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kegs">
<style>
  :root {
    /* Palette below is the exact spec provided - see README's "Design
       system" section for the source table. Functional colors
       (success/error/warning) aren't part of that spec, so they're
       chosen to harmonize with it: light tinted backgrounds, readable
       dark text, same visual language as the primary blue banner. */
    --bg: #FFFFFF;
    --card-bg: #F5F5F5;
    --card-border: #E8E6E0;
    --text: #1A1A1A;
    --text-secondary: #6B6B6B;
    --text-muted: #A0A0A0;
    --input-bg: #FFFFFF;
    --input-border: #D6D3CC;
    --primary: #2FA8F5;
    --primary-hover: #1E8FDB;
    --primary-tint-bg: #E6F1FB;
    --primary-tint-text-dark: #0C447C;
    --primary-tint-text-mid: #185FA5;
    --success-bg: #E8F5E9;
    --success-text: #1B5E20;
    --error-bg: #FDEBEA;
    --error-text: #B3261E;
    --error-border: #F3C6C2;
    --warn-bg: #FFF4E0;
    --warn-text: #8A5700;
  }
  /* Two weights only, per spec: 400 (regular) and 500 (medium) - never
     600/700/800. Sizes follow the spec's scale: 20px/500 greeting name,
     16px/500 app name & section titles, 14px/500 list-item titles,
     13px/400 secondary/meta text, 12px/400 nav labels and timestamps.
     Sentence case throughout - no uppercase transforms anywhere below. */
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 400; max-width: 480px; margin: 0 auto; padding: 20px 16px; color: var(--text); background: var(--bg); font-size: 14px; line-height: 1.5; }
  h2 { font-size: 20px; font-weight: 500; margin-bottom: 6px; color: var(--text); }
  h3 { font-size: 16px; font-weight: 500; color: var(--text); margin: 0 0 4px; }
  .muted { color: var(--text-secondary); font-size: 13px; font-weight: 400; }
  .card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 18px; margin: 16px 0; }
  label { display: block; font-size: 13px; margin: 12px 0 5px; font-weight: 500; color: var(--text); }
  /* Inputs stay at 16px regardless of the type scale above - anything
     smaller triggers iOS Safari's auto-zoom-on-focus, which is worse
     for usability than a one-off exception to the scale. */
  input, select { width: 100%; box-sizing: border-box; font-size: 16px; font-weight: 400; padding: 13px; border: 1px solid var(--input-border); border-radius: 8px; background: var(--input-bg); color: var(--text); }
  input:focus, select:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(47,168,245,0.18); }
  button { width: 100%; margin-top: 18px; font-size: 16px; font-weight: 500; padding: 14px; background: var(--primary); color: #FFFFFF; border: none; border-radius: 10px; cursor: pointer; }
  button:hover { background: var(--primary-hover); }

  .app-header { margin-bottom: 8px; }
  .keg-logo { display: block; margin: 4px auto 10px; border-radius: 50%; }
  .header-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .user-chip, .logout-btn { display: inline-block; padding: 7px 14px; border-radius: 20px; font-size: 13px; font-weight: 500; background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border); }
  .logout-btn { cursor: pointer; width: auto; margin: 0; }
  .logout-btn:hover { background: var(--primary-tint-bg); color: var(--primary-tint-text-dark); }
  .keg-title-row { font-size: 16px; font-weight: 500; color: var(--text); margin: 10px 0 6px; }
  .status-pill { display: inline-block; padding: 6px 16px; border-radius: 12px; background: var(--primary-tint-bg); color: var(--primary-tint-text-dark); font-size: 14px; font-weight: 500; }

  .error { color: var(--error-text); font-size: 13px; margin-top: 10px; font-weight: 400; }
  .success { color: var(--success-text); font-size: 13px; margin-top: 10px; font-weight: 400; }
  .history-item { border-bottom: 1px solid var(--card-border); padding: 10px 0; font-size: 13px; }
  .history-item b { font-weight: 500; }
  .offline-banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 14px; }
  .pending-banner { background: var(--primary-tint-bg); color: var(--primary-tint-text-mid); border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 14px; }
  .my-alerts-banner { background: var(--error-bg); color: var(--error-text); border-radius: 10px; padding: 12px 16px; font-size: 13px; margin-bottom: 14px; font-weight: 500; }
  .pending-banner button { width: auto; display: inline-block; margin: 8px 6px 0 0; padding: 8px 14px; font-size: 13px; }
  .wrong-turn-banner { font-size: 15px; }
  .pending-role { color: var(--success-text); font-weight: 500; text-transform: uppercase; }
  .geo-btn { width: auto; display: inline-block; margin-top: 6px; padding: 9px 14px; font-size: 13px; font-weight: 500; background: var(--primary-tint-bg); color: var(--primary-tint-text-dark); }
  .geo-btn:hover { background: #D6E9F9; }
  .inline-add-box { display: none; margin-top: 10px; padding: 12px; border: 1px solid var(--card-border); border-radius: 10px; background: var(--bg); }
  .destination-line { background: var(--primary-tint-bg); border-radius: 10px; padding: 12px 16px; margin: 10px 0; font-size: 14px; color: var(--primary-tint-text-dark); }
  .destination-line .address { display: block; color: var(--primary-tint-text-mid); font-size: 13px; margin-top: 3px; }
  .btn-danger-outline { background: #FFFFFF; color: var(--error-text); border: 1px solid var(--error-text); }
  .btn-danger-outline:hover { background: var(--error-bg); }

  /* Bottom-middle floating scan button, fixed above everything else -
     the easy-access entry point requested for the operational roles,
     also available to everyone else since it's just quick navigation
     to a different keg, not a permission-sensitive action. Icon-only,
     styled after iOS's viewfinder scan icon rather than a text label. */
  .scan-fab {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    width: 62px; height: 62px; padding: 0; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(0,0,0,0.22); z-index: 100; margin: 0;
  }
  body { padding-bottom: 90px; } /* keeps page content from hiding behind the fixed button */

  .scanner-overlay {
    display: none; position: fixed; inset: 0; background: #000000;
    z-index: 200; flex-direction: column; align-items: center; justify-content: center;
  }
  .scanner-overlay video { width: 100%; max-width: 480px; }
  .scanner-overlay .scanner-msg { color: #FFFFFF; font-size: 14px; padding: 14px 20px; text-align: center; }
  .scanner-overlay button { width: auto; margin-top: 20px; padding: 12px 28px; }
</style>
</head>
<body>

  <div id="offlineBanner" class="offline-banner" style="display:none">
    &#128246; No connection &mdash; you can still log an action below; it'll be saved on this device and sent automatically once you're back online.
  </div>
  <div id="pendingBanner" class="pending-banner" style="display:none"></div>

  <div id="loginBlock" class="card">
    <img class="keg-logo" src="/icon-192.png" width="56" height="56" alt="Only K logo">
    <h2>Who are you?</h2>
    <label>User</label>
    <select id="userSelect"></select>
    <label>Password</label>
    <input id="password" type="password" placeholder="Password">
    <button onclick="login()">Log in</button>
    <div id="loginError" class="error"></div>
  </div>

  <div id="appBlock" style="display:none">
    <div class="app-header">
      <img class="keg-logo" src="/icon-192.png" width="56" height="56" alt="Only K logo">
      <div class="header-row">
        <span class="user-chip" id="whoami"></span>
        <button class="logout-btn" onclick="logout();return false;">Log out</button>
      </div>
    </div>
    <div id="kegDestinationLine" class="destination-line" style="display:none">
      Destination: <b id="kegDestination"></b>
      <span class="address" id="kegDestinationAddress"></span>
      <span class="address" id="kegDestinationPhone"></span>
    </div>
    <div id="myAlertsBanner" class="my-alerts-banner" style="display:none"></div>

    <div id="homeScreenBlock" class="card" style="display:none">
      <h2 id="homeGreeting" style="margin-top:0"></h2>
      <p class="muted">Scan a keg's QR code to get started.</p>
    </div>

    <div class="card" id="formCard"></div>

    <div class="card" id="historyCard" style="display:none">
      <h3 style="margin-top:0">History</h3>
      <div id="history"></div>
    </div>

    <div class="card" id="fillDetailsCard" style="display:none">
      <div id="fillDetailsContent"></div>
    </div>
  </div>

  <button id="scanFab" class="scan-fab" onclick="openScanner()" style="display:none" aria-label="Scan a keg">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 7V4a1 1 0 0 1 1-1h3"/>
      <path d="M17 3h3a1 1 0 0 1 1 1v3"/>
      <path d="M21 17v3a1 1 0 0 1-1 1h-3"/>
      <path d="M7 21H4a1 1 0 0 1-1-1v-3"/>
    </svg>
  </button>

  <div id="scannerOverlay" class="scanner-overlay">
    <video id="scannerVideo" autoplay playsinline muted></video>
    <canvas id="scannerCanvas" style="display:none"></canvas>
    <div id="scannerMsg" class="scanner-msg"></div>
    <button onclick="closeScanner()">Cancel</button>
  </div>

<script src="/offline-queue.js"></script>
<script src="/device-id.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
const kegId = new URLSearchParams(location.search).get('keg');
let currentUser = null;
let keg = null;

// ---- Role -> form field config -------------------------------------------
// This is the single place that drives "different roles fill different
// fields" from the original requirement. Add a role/action and its fields
// here; the form renders itself from this table.
//
// Fields marked `geo: true` get a "Use my current location" button next
// to them (see useMyLocation() below), which fills the field with the
// device's actual GPS coordinates via the browser's Geolocation API.
// Still a plain text field underneath, so it can be corrected/typed
// manually too (e.g. if GPS is unavailable or inaccurate indoors).
//
// Fields marked `requiredWhen: { field, equals, minLength? }` are only
// mandatory when another field in the same form has a specific value -
// e.g. damage notes are only required (and held to a minimum length) if
// the inspection result is "fail". Enforced client-side in
// checkRequiredFields() before submission.
const ROLE_ACTIONS = {
  washer: {
    action: 'wash', label: 'Log wash',
    fields: [
      { name: 'wash_cycle', label: 'Wash cycle type', type: 'select', options: ['caustic', 'sanitize', 'rinse_only'] },
      { name: 'inspection', label: 'Inspection result', type: 'select', options: ['pass', 'fail'] },
      { name: 'notes', label: 'Damage notes (min 30 characters if failed)', type: 'text', requiredWhen: { field: 'inspection', equals: 'fail', minLength: 30 } },
    ],
  },
  filler: {
    action: 'fill', label: 'Log fill',
    fixedDetails: { volume_liters: 20 }, // every fill is 20L - not a field the user fills in, just recorded automatically
    fields: [
      { name: 'product', label: 'Beer Name', type: 'product_select', required: true },
      { name: 'batch_number', label: 'Batch Number', type: 'text', required: true },
      { name: 'abv', label: 'ABV %', type: 'number', required: true },
    ],
  },
  driver: {
    // Driver's first involvement is confirming delivery - Warehouse
    // assigning a destination now dispatches the keg directly (see
    // warehouse.assign_destination below), so there's no separate
    // driver-initiated "dispatch" step anymore.
    delivered_from_dispatched: {
      action: 'deliver', label: 'Log delivery',
      fields: [
        { name: 'location', label: 'Delivery location (confirm)', type: 'text', geo: true, required: true },
        { name: 'customer_signature', label: 'Customer name (signature)', type: 'text' },
      ],
    },
    empty_from_delivered: {
      action: 'mark_empty', label: 'Mark keg empty at customer',
      fields: [],
    },
  },
  warehouse: {
    // Warehouse has three possible actions depending on the keg's status.
    // Assigning a destination also dispatches the keg in one step - see
    // lib/stateMachine.js's assign_destination rule. There's no separate
    // generic "log location" step anymore (removed - see getActionConfig()
    // below for why): it was redundant right after receiving an empty
    // keg (which already asks for a storage zone) and had no natural
    // stopping point, so it kept re-appearing.
    assign_destination: {
      action: 'assign_destination', label: 'Assign destination & dispatch',
      fields: [
        { name: 'customer_id', label: 'Delivery destination (customer)', type: 'customer_select', required: true },
      ],
    },
    receive_from_empty_at_customer: {
      action: 'receive_empty', label: 'Receive empty keg back into warehouse',
      fields: [
        { name: 'location', label: 'Storage zone', type: 'text', geo: true, required: true },
      ],
    },
    mark_repaired: {
      // A failed wash inspection routes the keg here instead of
      // 'washed' (see lib/stateMachine.js) - this is what lets someone
      // confirm it's actually fixed before it re-enters the normal
      // cycle, rather than a failed inspection having no consequence.
      action: 'mark_repaired', label: 'Mark keg repaired - ready for wash',
      fields: [
        { name: 'notes', label: 'Repair notes (optional)', type: 'text' },
      ],
    },
  },
};

// Which role is expected to act next for each status - used only to make
// the "not your turn" warning more useful (tells someone who scans at the
// wrong point who to actually hand the keg to), not for any validation.
const STATUS_EXPECTED_ROLE = {
  empty_returned: 'washer',
  washed: 'filler',
  filled: 'warehouse',
  dispatched: 'driver',
  delivered: 'driver',
  empty_at_customer: 'warehouse',
  needs_repair: 'warehouse',
};

async function init() {
  // If a session cookie is already valid (e.g. page refresh), skip the
  // login screen entirely.
  let me = null;
  try {
    const meRes = await fetch('/api/auth/me', { credentials: 'include' });
    me = await meRes.json();
  } catch (err) {
    // No connectivity and nothing cached yet on this device - the very
    // first visit has to happen online (to log in and cache the shell +
    // this keg at least once). After that, offline works.
    document.getElementById('loginBlock').innerHTML =
      '<p class="error">No connection, and this device hasn\'t logged in here before. Connect once to log in - after that this page works offline.</p>';
    return;
  }

  if (me) {
    currentUser = me;
    showApp();
    return;
  }

  const res = await fetch('/api/auth/users');
  const users = await res.json();
  document.getElementById('userSelect').innerHTML =
    users.map(u => `<option value="${u.id}">${u.name} (${u.role})</option>`).join('');
}

async function login() {
  const userId = document.getElementById('userSelect').value;
  const password = document.getElementById('password').value;
  const res = await fetch('/api/auth/login', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    credentials: 'include', // required so the session cookie is stored/sent
    body: JSON.stringify({ userId, password, deviceId: DeviceId.get() }),
  });
  if (!res.ok) {
    // Show the server's actual reason (wrong password, or now also a
    // possible "device not approved" rejection - see lib/deviceAuth.js)
    // instead of a fixed "Invalid password" that would be misleading for
    // the device case.
    const data = await res.json().catch(() => ({}));
    document.getElementById('loginError').textContent = data.error || 'Invalid password';
    return;
  }
  currentUser = await res.json();
  showApp();
}

async function logout() {
  await fetch('/api/auth/logout', { method: 'POST', credentials: 'include' });
  location.reload();
}

function showApp() {
  document.getElementById('loginBlock').style.display = 'none';
  document.getElementById('appBlock').style.display = 'block';
  document.getElementById('whoami').textContent = `${currentUser.name} (${currentUser.role})`;
  loadMyAlerts();

  // The scan button is available to everyone logged in - it's just
  // quick navigation to a different keg, not a permission-sensitive
  // action, so no role restriction here (unlike most other features).
  document.getElementById('scanFab').style.display = 'block';

  // No keg in the URL - this page was opened directly (e.g. from an
  // installed home-screen icon), not via a QR scan. Show a
  // personalized landing screen instead of erroring out trying to
  // fetch a keg that was never specified.
  if (!kegId) {
    showHomeScreen();
    return;
  }

  loadKeg();
}

function showHomeScreen() {
  document.getElementById('formCard').style.display = 'none';
  document.getElementById('historyCard').style.display = 'none';
  document.getElementById('fillDetailsCard').style.display = 'none';
  document.getElementById('homeScreenBlock').style.display = 'block';

  const hour = new Date().getHours();
  const timeGreeting = hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
  const firstName = currentUser.name.split(' ')[0];
  document.getElementById('homeGreeting').textContent = `${timeGreeting}, ${firstName}!`;
}

async function loadMyAlerts() {
  // Shows how many kegs are overdue for this person's role - a count
  // only, deliberately no keg IDs or links here. Showing individual
  // IDs with a one-tap shortcut straight to the action form would make
  // it too easy to log a wash/fill/dispatch without actually being
  // physically at that keg to scan it - which defeats the point of
  // QR-based verification in the first place. (Admin/Manager's alerts
  // list on the admin page is different - they're not the ones
  // performing these physical actions, so that list keeps its
  // clickable keg IDs for oversight purposes.)
  try {
    const res = await fetch('/api/alerts', { credentials: 'include' });
    if (!res.ok) return;
    const alerts = await res.json();
    const mine = alerts.filter(a => a.role === currentUser.role);
    const banner = document.getElementById('myAlertsBanner');
    if (mine.length > 0) {
      banner.style.display = 'block';
      const otherWord = kegId ? 'other ' : '';
      banner.textContent = `\u26A0 ${mine.length} ${otherWord}keg${mine.length > 1 ? 's are' : ' is'} overdue for your role.`;
    } else {
      banner.style.display = 'none';
    }
  } catch (err) {
    // Offline or alerts fetch failed - not critical, just skip the banner silently.
  }
}

async function loadKeg() {
  let res;
  try {
    // credentials: 'include' is required now - the backend
    // (routes/kegs.js) decides whether to include manufacturing_number
    // based on the logged-in session, so without sending the cookie,
    // Admin/Manager would never see it either.
    res = await fetch(`/api/kegs/${kegId}`, { credentials: 'include' });
  } catch (err) {
    // No connectivity at all - fall back to the last-known data for this
    // keg, if we have any (i.e. this device has scanned it before).
    const cached = OfflineQueue.getCachedKeg(kegId);
    if (cached) {
      keg = cached;
      renderOfflineFallback();
      return;
    }
    document.getElementById('formCard').innerHTML =
      `<p class="error">No connection, and this keg hasn't been loaded on this device before, so there's nothing cached to show.</p>`;
    return;
  }

  if (!res.ok) {
    document.getElementById('formCard').innerHTML = `<p class="error">Keg ${kegId} not found.</p>`;
    return;
  }
  keg = await res.json();
  OfflineQueue.cacheKeg(keg); // keep a local copy for the next time there's no signal
  updateDestinationLine();
  await renderForm();
  renderHistory();
  updatePendingBanner();
}

function renderOfflineFallback() {
  updateDestinationLine();
  renderForm();

  // Same Admin/Manager-only history split as renderHistory() above, but
  // without real history data available offline - just says so, in
  // whichever card this role would normally see.
  const isOversight = currentUser.role === 'admin' || currentUser.role === 'manager';
  document.getElementById('historyCard').style.display = isOversight ? 'block' : 'none';
  document.getElementById('fillDetailsCard').style.display = isOversight ? 'none' : 'block';
  const targetId = isOversight ? 'history' : 'fillDetailsContent';
  document.getElementById(targetId).innerHTML =
    '<p class="muted">Unavailable while offline.</p>';

  updatePendingBanner();
}

function updateDestinationLine() {
  const line = document.getElementById('kegDestinationLine');
  if (keg.destination) {
    document.getElementById('kegDestination').textContent = keg.destination;
    // Show the address AND phone too, not just the customer's name - a
    // driver needs to know exactly where to go and who to call, not
    // just who they're delivering to (this was confusing before: name
    // alone doesn't tell you a location or how to reach someone).
    const addressEl = document.getElementById('kegDestinationAddress');
    addressEl.textContent = keg.destination_address ? keg.destination_address : '';
    const phoneEl = document.getElementById('kegDestinationPhone');
    phoneEl.innerHTML = keg.destination_phone
      ? `<a href="tel:${keg.destination_phone.replace(/\s+/g, '')}" style="color:inherit;text-decoration:underline">\u260E ${keg.destination_phone}</a>`
      : '';
    line.style.display = 'block';
  } else {
    line.style.display = 'none';
  }
}

function getActionConfig() {
  const cfg = ROLE_ACTIONS[currentUser.role];
  if (!cfg) return null;

  // Every branch below mirrors the "from" states enforced server-side in
  // lib/stateMachine.js - keeping these in sync matters: this is what
  // stops (say) a washer from even seeing the wash form while a keg is
  // already filled or dispatched, instead of only finding out after
  // submitting and getting rejected. See renderForm()'s handling of a
  // null return for the actual on-screen warning shown in that case.
  if (currentUser.role === 'washer') {
    return keg.status === 'empty_returned' ? cfg : null;
  }

  if (currentUser.role === 'filler') {
    return keg.status === 'washed' ? cfg : null;
  }

  if (currentUser.role === 'driver') {
    // Driver's first involvement is confirming delivery once Warehouse
    // has already dispatched it (see warehouse's assign_destination,
    // which dispatches directly - no separate driver-initiated step).
    if (keg.status === 'dispatched') return cfg.delivered_from_dispatched;
    if (keg.status === 'delivered') return cfg.empty_from_delivered;
    return null;
  }

  if (currentUser.role === 'warehouse') {
    // Warehouse has exactly three active jobs, each tied to one specific
    // status - assigning a destination (which also dispatches, see
    // lib/stateMachine.js), receiving an empty keg back, and resolving a
    // keg that failed wash inspection. Every other status belongs to a
    // different role, so nothing more is offered here - this used to
    // fall through to a generic "log location" step, which had no
    // natural stopping point and re-appeared right after receiving an
    // empty keg (redundant, since that already asks for a storage zone).
    if (keg.status === 'filled') return cfg.assign_destination;
    if (keg.status === 'empty_at_customer') return cfg.receive_from_empty_at_customer;
    if (keg.status === 'needs_repair') return cfg.mark_repaired;
    return null;
  }

  return null;
}

// Cached customer list, so switching between forms doesn't re-fetch every
// time. Passed true to refetch after adding a new customer.
let customersCache = null;
async function fetchCustomers(forceRefresh) {
  if (customersCache && !forceRefresh) return customersCache;
  try {
    const res = await fetch('/api/customers', { credentials: 'include' });
    customersCache = res.ok ? await res.json() : (customersCache || []);
  } catch (err) {
    customersCache = customersCache || []; // offline - keep whatever we had, or empty
  }
  return customersCache;
}

let productsCache = null;
async function fetchProducts(forceRefresh) {
  if (productsCache && !forceRefresh) return productsCache;
  try {
    const res = await fetch('/api/products', { credentials: 'include' });
    productsCache = res.ok ? await res.json() : (productsCache || []);
  } catch (err) {
    productsCache = productsCache || [];
  }
  return productsCache;
}

// When a beer is picked, auto-fill its typical ABV (still editable -
// actual batches can vary slightly, this is just a helpful starting
// point). Reads straight off the selected <option>'s data-abv attribute
// rather than looking the product up by id - simpler, and consistent
// with the dropdown submitting the beer's NAME as the value (not an id),
// since that's what lib/reports.js's getFillStats() already expects in
// details.product, and what any existing fill history already has.
function onProductSelected(selectEl) {
  const abvField = document.getElementById('f_abv');
  const opt = selectEl.options[selectEl.selectedIndex];
  const abv = opt ? opt.dataset.abv : '';
  if (abvField && abv) abvField.value = abv;
}

function toggleAddCustomer() {
  const box = document.getElementById('addCustomerBox');
  if (!box) return;
  // Checks the actual rendered display (whether it's hidden via the CSS
  // class or a previous inline override), not just the inline style
  // attribute directly - a plain `box.style.display === 'none'` check
  // would be wrong now that hiding comes from the .inline-add-box CSS
  // class rather than an inline style.
  const isHidden = getComputedStyle(box).display === 'none';
  box.style.display = isHidden ? 'block' : 'none';
}

function toggleAddProduct() {
  const box = document.getElementById('addProductBox');
  if (!box) return;
  const isHidden = getComputedStyle(box).display === 'none';
  box.style.display = isHidden ? 'block' : 'none';
}

async function addNewCustomer() {
  const name = document.getElementById('newCustomerName').value.trim();
  const address = document.getElementById('newCustomerAddress').value.trim();
  const phone = document.getElementById('newCustomerPhone').value.trim();
  const msg = document.getElementById('addCustomerMsg');
  if (!name) {
    msg.className = 'error';
    msg.textContent = 'Customer name is required.';
    return;
  }
  msg.className = 'muted';
  msg.textContent = 'Adding...';

  let res;
  try {
    res = await fetch('/api/customers', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ name, address, phone }),
    });
  } catch (err) {
    msg.className = 'error';
    msg.textContent = 'No connection - try again once online.';
    return;
  }

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    msg.className = 'error';
    msg.textContent = data.error || 'Could not add customer.';
    return;
  }

  const newCustomer = await res.json();
  await fetchCustomers(true); // refresh cache so the dropdown includes it
  await renderForm(); // rebuild the form - new customer now in the list
  const sel = document.getElementById('f_customer_id');
  if (sel) sel.value = newCustomer.id; // pre-select the one just added
}

async function addNewProduct() {
  const name = document.getElementById('newProductName').value.trim();
  const abvRaw = document.getElementById('newProductAbv').value;
  const msg = document.getElementById('addProductMsg');
  if (!name) {
    msg.className = 'error';
    msg.textContent = 'Beer name is required.';
    return;
  }
  msg.className = 'muted';
  msg.textContent = 'Adding...';

  let res;
  try {
    res = await fetch('/api/products', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify({ name, default_abv: abvRaw || null }),
    });
  } catch (err) {
    msg.className = 'error';
    msg.textContent = 'No connection - try again once online.';
    return;
  }

  if (!res.ok) {
    const data = await res.json().catch(() => ({}));
    msg.className = 'error';
    msg.textContent = data.error || 'Could not add beer.';
    return;
  }

  const newProduct = await res.json();
  await fetchProducts(true); // refresh cache so the dropdown includes it
  await renderForm(); // rebuild the form - new beer now in the list
  const sel = document.getElementById('f_product');
  if (sel) { sel.value = newProduct.name; onProductSelected(sel); }
}

async function renderForm() {
  const card = document.getElementById('formCard');

  const pending = OfflineQueue.pendingFor(kegId);
  if (pending) {
    card.innerHTML = `
      <h3 style="margin-top:0">Action queued</h3>
      <p class="muted">A "${pending.actionType.replace(/_/g,' ')}" is saved on this device, waiting to sync.
      It'll send automatically once you're back online, or tap "Sync now" above.</p>
    `;
    return;
  }

  const cfg = getActionConfig();
  if (!cfg) {
    const expectedRole = STATUS_EXPECTED_ROLE[keg.status];
    card.innerHTML = `
      <div class="wrong-turn-banner">
        Keg is pending on: <span class="pending-role">${expectedRole || 'unknown'}</span>
      </div>
    `;
    return;
  }

  // Prefetch anything a field needs before building the HTML, so the
  // template below can be built synchronously in one pass.
  let customers = [];
  let products = [];
  if (cfg.fields.some((f) => f.type === 'customer_select')) {
    customers = await fetchCustomers();
  }
  if (cfg.fields.some((f) => f.type === 'product_select')) {
    products = await fetchProducts();
  }

  card.innerHTML = `
    <h3 style="margin-top:0">${cfg.label}</h3>
    ${cfg.fields.map((f) => {
      if (f.type === 'customer_select') {
        return `
          <label>${f.label}</label>
          <select id="f_${f.name}">
            <option value="">-- select customer --</option>
            ${customers.map((c) => `<option value="${c.id}">${c.name}</option>`).join('')}
          </select>
          <button type="button" onclick="toggleAddCustomer()" class="geo-btn">&#43; Add new customer</button>
          <div id="addCustomerBox" class="inline-add-box">
            <label>New customer name</label>
            <input id="newCustomerName" type="text">
            <label>Address (optional)</label>
            <input id="newCustomerAddress" type="text">
            <label>Mobile number (optional)</label>
            <input id="newCustomerPhone" type="tel">
            <button type="button" onclick="addNewCustomer()" style="margin-top:8px">Add customer</button>
            <div id="addCustomerMsg" class="muted"></div>
          </div>
        `;
      }
      if (f.type === 'product_select') {
        return `
          <label>${f.label}</label>
          <select id="f_${f.name}" onchange="onProductSelected(this)">
            <option value="">-- select beer --</option>
            ${products.map((p) => `<option value="${p.name}" data-abv="${p.default_abv ?? ''}">${p.name}</option>`).join('')}
          </select>
          <button type="button" onclick="toggleAddProduct()" class="geo-btn">&#43; Add new beer</button>
          <div id="addProductBox" class="inline-add-box">
            <label>New beer name</label>
            <input id="newProductName" type="text">
            <label>Typical ABV % (optional)</label>
            <input id="newProductAbv" type="number" step="0.1">
            <button type="button" onclick="addNewProduct()" style="margin-top:8px">Add beer</button>
            <div id="addProductMsg" class="muted"></div>
          </div>
        `;
      }
      const isLocationOptional = f.geo && !f.required;
      return `
        <label>${f.label}${isLocationOptional ? ' <span class="muted">(optional)</span>' : ''}</label>
        ${f.type === 'select'
          ? `<select id="f_${f.name}">${f.options.map(o => `<option value="${o}">${o.replace(/_/g,' ')}</option>`).join('')}</select>`
          : `<input id="f_${f.name}" type="${f.type}" ${f.geo ? `placeholder="Tap 'Use my location' or type manually"` : ''}>`}
        ${f.geo ? `<button type="button" class="geo-btn" onclick="useMyLocation('${f.name}')">&#128205; Use my location</button>
        <span id="geoMsg_${f.name}" class="muted"></span>` : ''}
      `;
    }).join('')}
    <button id="submitBtn" onclick="submitEvent('${cfg.action}')">${cfg.label}</button>
    <div id="submitMsg"></div>
  `;

  // Damage reporting: a separate, secondary action available to a
  // driver at any point while they physically have the keg (before or
  // after handing it off), alongside whatever their normal next step
  // is - not folded into the main form above, since it's an exception
  // path, not the expected next action.
  if (currentUser.role === 'driver' && (keg.status === 'dispatched' || keg.status === 'delivered')) {
    card.innerHTML += `
      <button type="button" class="btn-danger-outline" onclick="reportDamage()" style="margin-top:14px">&#9888; Report damage instead</button>
    `;
  }
}

// Checks any `requiredWhen` conditions on the current form's fields
// against what's actually been entered - both presence and, if set, a
// minimum length. Returns an error string, or null if everything
// required is present and long enough.
// Checks:
// - plain `required: true` fields are non-empty, always
// - `requiredWhen` conditions (presence, and optionally a minimum length)
//   against what's actually been entered, only when the condition applies
// Returns an error string, or null if everything checks out.
function checkRequiredFields(cfg, values) {
  for (const f of cfg.fields) {
    if (f.required) {
      const val = (values[f.name] || '').trim();
      if (!val) {
        return `${f.label.replace(/\s*\(.*\)/, '')} is required.`;
      }
    }

    if (!f.requiredWhen) continue;
    const depValue = values[f.requiredWhen.field];
    if (depValue !== f.requiredWhen.equals) continue; // condition doesn't apply right now
    const val = (values[f.name] || '').trim();
    if (!val) {
      return `${f.label.replace(/\s*\(.*\)/, '')} is required when ${f.requiredWhen.field.replace(/_/g,' ')} is "${f.requiredWhen.equals}".`;
    }
    if (f.requiredWhen.minLength && val.length < f.requiredWhen.minLength) {
      return `${f.label.replace(/\s*\(.*\)/, '')} needs at least ${f.requiredWhen.minLength} characters when ${f.requiredWhen.field.replace(/_/g,' ')} is "${f.requiredWhen.equals}" (currently ${val.length}).`;
    }
  }
  return null;
}

function useMyLocation(fieldName) {
  const msg = document.getElementById(`geoMsg_${fieldName}`);
  if (!('geolocation' in navigator)) {
    msg.textContent = 'GPS not available on this device/browser.';
    return;
  }
  msg.textContent = 'Getting location...';
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const { latitude, longitude } = pos.coords;
      document.getElementById(`f_${fieldName}`).value =
        `${latitude.toFixed(5)}, ${longitude.toFixed(5)}`;
      msg.textContent = '';
    },
    (err) => {
      // Common cases: user denied the permission prompt, or GPS timed out
      // (e.g. deep indoors). Field stays editable either way.
      msg.textContent = err.code === err.PERMISSION_DENIED
        ? 'Location permission denied - type it manually instead.'
        : 'Could not get location - type it manually instead.';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

let isSubmitting = false; // guards against double-submit (double-tap, slow network + impatient re-tap)

// Damage reporting is a secondary, exception-path action for Driver -
// not built through the generic field-rendering system above (that's
// for a role's expected next action), just a direct prompt + submit,
// sharing the same offline-queue and error-handling shape as
// submitEvent() below rather than duplicating it wholesale.
async function reportDamage() {
  if (isSubmitting) return;

  const notes = prompt('Describe the damage (required):');
  if (notes === null) return; // cancelled
  if (!notes.trim()) { alert('A description is required to report damage.'); return; }

  isSubmitting = true;
  try {
    const details = { notes: notes.trim() };
    let res;
    try {
      res = await fetch(`/api/kegs/${kegId}/events`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ actionType: 'report_damage', details }),
      });
    } catch (err) {
      if (!OfflineQueue.canQueueFor(kegId)) {
        alert('There is already a queued action for this keg on this device - sync that one before adding another.');
        return;
      }
      OfflineQueue.enqueue({ kegId, actionType: 'report_damage', details });
      renderForm();
      updatePendingBanner();
      return;
    }

    const data = await res.json();
    if (!res.ok) {
      alert(data.error || 'Could not report damage.');
      return;
    }
    await loadKeg(); // re-renders - keg is now needs_repair, driver's form will show "not your turn" until Warehouse resolves it
  } finally {
    isSubmitting = false;
  }
}

async function submitEvent(action) {
  if (isSubmitting) return; // ignore a second click while the first is still in flight

  const cfg = getActionConfig();
  const details = { ...(cfg.fixedDetails || {}) }; // e.g. filler's fixed 20L volume, not a visible field
  cfg.fields.forEach(f => { details[f.name] = document.getElementById(`f_${f.name}`).value; });

  const requiredError = checkRequiredFields(cfg, details);
  if (requiredError) {
    const msg = document.getElementById('submitMsg');
    msg.className = 'error';
    msg.textContent = requiredError;
    return; // never reaches the network - same guard applies whether online or offline
  }

  isSubmitting = true;
  const submitBtn = document.getElementById('submitBtn');
  if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'Submitting...'; }

  try {
    let res;
    try {
      res = await fetch(`/api/kegs/${kegId}/events`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        credentials: 'include', // session cookie identifies the user - no userId sent
        body: JSON.stringify({ actionType: action, details }),
      });
    } catch (err) {
      // Network failure (not a server rejection) - save it locally instead
      // of losing the work. It'll send automatically once back online.
      if (!OfflineQueue.canQueueFor(kegId)) {
        document.getElementById('submitMsg').className = 'error';
        document.getElementById('submitMsg').textContent =
          'There is already a queued action for this keg on this device - sync that one before adding another.';
        return;
      }
      OfflineQueue.enqueue({ kegId, actionType: action, details });
      renderForm(); // now shows the "queued" state instead of the form
      updatePendingBanner();
      return;
    }

    const data = await res.json();
    const msg = document.getElementById('submitMsg');
    if (!res.ok) {
      msg.className = 'error';
      msg.textContent = data.error;
      if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = cfg.label; }
      return;
    }
    msg.className = 'success';
    msg.textContent = 'Logged. New status: ' + data.status.replace(/_/g, ' ');
    await loadKeg(); // re-renders the form (or "no action available"), so submitBtn no longer exists to re-enable
  } finally {
    isSubmitting = false;
  }
}

// The database stores timestamps in UTC as plain "YYYY-MM-DD HH:MM:SS"
// text (SQLite's datetime('now'), no timezone marker in the string
// itself). This converts one of those for display in Indian Standard
// Time - storage stays UTC (the correct practice), only the display
// layer converts.
function formatIST(dateVal) {
  if (!dateVal) return '';
  // Postgres serializes timestamps as full ISO strings (e.g.
  // "2026-08-31T20:15:32.123Z") - parseable directly with new Date().
  // This also tolerates the older SQLite-style "YYYY-MM-DD HH:MM:SS"
  // (no 'T', no timezone marker) just in case, treating it as UTC the
  // same way the original version did.
  const str = String(dateVal);
  const isoStr = str.includes('T') ? str : str.replace(' ', 'T') + 'Z';
  const date = new Date(isoStr);
  if (isNaN(date.getTime())) return str; // fall back to the raw value if parsing ever fails
  return date.toLocaleString('en-IN', {
    timeZone: 'Asia/Kolkata',
    day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', hour12: true,
  }) + ' IST';
}

async function renderHistory() {
  // Full event history is Admin/Manager only - everyone else sees just
  // the current fill's details (what beer is actually in this keg)
  // instead, which is what they'd realistically need day-to-day rather
  // than the complete audit trail.
  const isOversight = currentUser.role === 'admin' || currentUser.role === 'manager';
  document.getElementById('historyCard').style.display = isOversight ? 'block' : 'none';
  document.getElementById('fillDetailsCard').style.display = isOversight ? 'none' : 'block';

  if (isOversight) {
    const el = document.getElementById('history');
    if (!keg.history.length) { el.innerHTML = '<p class="muted">No events yet.</p>'; return; }
    el.innerHTML = keg.history.slice().reverse().map(h => `
      <div class="history-item">
        <b>${h.action_type.replace(/_/g,' ')}</b> by ${h.user_name} (${h.role})<br>
        <span class="muted">${formatIST(h.created_at)}</span>
        ${Object.keys(h.details).length ? `<br><span class="muted">${JSON.stringify(h.details)}</span>` : ''}
      </div>
    `).join('');
    return;
  }

  const fillEvent = keg.history.slice().reverse().find((h) => h.action_type === 'fill');
  const el = document.getElementById('fillDetailsContent');
  const kegIdLine = `<p style="text-align:center;font-weight:700">${keg.id}</p>`;
  if (!fillEvent) {
    el.innerHTML = kegIdLine + '<p class="muted">Not filled yet.</p>';
    return;
  }
  const d = fillEvent.details || {};
  el.innerHTML = `
    ${kegIdLine}
    <p><b>Beer:</b> ${d.product || '-'}</p>
    <p><b>Batch number:</b> ${d.batch_number || '-'}</p>
    <p><b>ABV:</b> ${d.abv ? d.abv + '%' : '-'}</p>
  `;
}

// ---- Offline / sync UI -----------------------------------------------

function updatePendingBanner() {
  const banner = document.getElementById('pendingBanner');
  const n = OfflineQueue.count();
  if (n === 0) {
    banner.style.display = 'none';
    return;
  }
  banner.style.display = 'block';
  banner.innerHTML = `
    ${n} action${n > 1 ? 's' : ''} saved on this device, waiting to sync.
    <br><button onclick="trySync()">Sync now</button>
  `;
}

function updateOfflineBanner() {
  document.getElementById('offlineBanner').style.display = navigator.onLine ? 'none' : 'block';
}

async function trySync() {
  const outcome = await OfflineQueue.syncAll();
  updatePendingBanner();
  if (keg) await loadKeg(); // reflect whatever just synced, or re-show "queued" if still offline

  if (outcome.rejected.length) {
    const rejectedHtml = outcome.rejected.map(({ item, error }) => `
      <div class="error" style="margin-top:6px">
        "${item.actionType.replace(/_/g,' ')}" for ${item.kegId} was rejected: ${error}
        <br><button onclick="discardQueuedItem('${item.id}')" style="margin-top:4px">Discard this action</button>
      </div>
    `).join('');
    document.getElementById('pendingBanner').innerHTML += rejectedHtml;
  }
}

function discardQueuedItem(id) {
  // Lets someone clear a permanently-rejected queued action (e.g. it was
  // superseded by someone else's update) instead of it blocking this keg
  // on this device forever - see the comment in offline-queue.js's
  // syncAll() for why rejections aren't auto-dropped.
  OfflineQueue.removeById(id);
  updatePendingBanner();
  if (keg) renderForm(); // re-check whether this keg can now show its normal form again
}

// Auto-sync whenever connectivity returns, and re-check periodically in
// case the 'online' event doesn't fire reliably (common on mobile).
window.addEventListener('online', () => { updateOfflineBanner(); trySync(); });
window.addEventListener('offline', updateOfflineBanner);
setInterval(() => { if (navigator.onLine && OfflineQueue.count() > 0) trySync(); }, 30000);

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {
    // Non-fatal: app still works online-only if the service worker fails
    // to register (e.g. unsupported browser) - just no offline app-shell caching.
  });
}

// ---- In-app QR scanner ------------------------------------------------
// Uses the device camera directly (getUserMedia) + jsQR (a small,
// dependency-free QR decoder loaded via CDN, cached by the service
// worker after first use - see sw.js) rather than relying on the
// phone's own Camera app. Requires HTTPS (or localhost) - same
// requirement as the GPS location buttons elsewhere on this page.

let scannerStream = null;
let scannerRafId = null;

async function openScanner() {
  const overlay = document.getElementById('scannerOverlay');
  const video = document.getElementById('scannerVideo');
  const msg = document.getElementById('scannerMsg');
  overlay.style.display = 'flex';
  msg.textContent = 'Loading scanner...';

  if (typeof jsQR === 'undefined') {
    msg.textContent = 'Scanner failed to load - check your connection and try again, or use your phone\'s camera app instead.';
    return;
  }

  if (!('mediaDevices' in navigator) || !navigator.mediaDevices.getUserMedia) {
    msg.textContent = 'Camera access isn\'t available on this browser - use your phone\'s camera app instead.';
    return;
  }

  msg.textContent = 'Requesting camera access...';
  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
  } catch (err) {
    msg.textContent = err.name === 'NotAllowedError'
      ? 'Camera permission denied - check your browser/device settings and try again.'
      : 'Could not access the camera - use your phone\'s camera app instead.';
    return;
  }

  video.srcObject = scannerStream;
  msg.textContent = 'Point the camera at a keg\'s QR code.';
  scanLoop();
}

function scanLoop() {
  const video = document.getElementById('scannerVideo');
  const canvas = document.getElementById('scannerCanvas');

  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if (code && code.data) {
      handleScanResult(code.data);
      return; // stop the loop - handleScanResult closes the scanner
    }
  }
  scannerRafId = requestAnimationFrame(scanLoop);
}

function handleScanResult(text) {
  closeScanner();

  // The QR code encodes a full URL (e.g.
  // https://yourapp.onrender.com/scan.html?keg=KEG-XXXX) - pull the
  // keg id out of it. Falls back to treating the scanned text as a
  // raw keg id directly, in case a QR was ever generated without the
  // full URL wrapper.
  let newKegId = null;
  try {
    const url = new URL(text);
    newKegId = url.searchParams.get('keg');
  } catch (err) {
    newKegId = text.trim();
  }

  if (!newKegId) {
    alert('Could not read a keg ID from that QR code - try again.');
    return;
  }

  // Full page navigation, same as scanning with the phone's own camera
  // app always has - keeps this one consistent code path for "a keg
  // was scanned" rather than trying to hot-swap state in place.
  window.location.href = `/scan.html?keg=${encodeURIComponent(newKegId)}`;
}

function closeScanner() {
  if (scannerRafId) { cancelAnimationFrame(scannerRafId); scannerRafId = null; }
  if (scannerStream) {
    scannerStream.getTracks().forEach((t) => t.stop());
    scannerStream = null;
  }
  document.getElementById('scannerOverlay').style.display = 'none';
}

updateOfflineBanner();
init();
</script>
